name: m0bambospool

services:
  m0bambospool:
    build:
      context: .
      no_cache: true
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    container_name: m0BamboSpool
    restart: unless-stopped
    env_file:
      - config.env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/home/app/data
      - ./logs:/home/app/logs
      - ./static/prints:/home/app/static/prints
    command:
      - waitress-serve
      - --host=0.0.0.0
      - --port=8000
      - app_custom:app
    environment:
      - TZ=Europe/Berlin
