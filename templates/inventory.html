{% extends "base.html" %}
{% block content %}
<section class="inventory-workspace" aria-label="Inventar">
  <div class="inventory-toolbar">
    <label class="inventory-control">Gruppieren
      <select id="inventory-group-select" class="form-select form-select-sm">
        <option value="filament">Filament</option>
        <option value="vendor">Hersteller</option>
        <option value="material">Material</option>
        <option value="none">Keine Gruppierung</option>
      </select>
    </label>
    <label class="inventory-control">Sortieren
      <select id="inventory-sort-select" class="form-select form-select-sm">
        <option value="last-used">Letzte Verwendung</option>
        <option value="name">Name</option>
        <option value="remaining">Restgewicht</option>
      </select>
    </label>
    <label class="inventory-control inventory-search">Filtern
      <input id="inventory-search" class="form-control form-control-sm" type="search" placeholder="Filament, Hersteller oder Material">
    </label>
  </div>
  <div class="inventory-layout">
    <div id="inventory-groups" class="inventory-groups" aria-live="polite"></div>
    <aside id="inventory-inline-editor" class="inventory-inline-editor" hidden aria-live="polite">
      <div class="inventory-editor-heading"><div><div class="small text-muted">Lokale Stammdaten</div><h2 id="inventory-editor-title" class="h5 mb-0"></h2></div><span id="inventory-editor-state" class="small text-muted"></span></div>
      <p class="small text-muted mb-3">&Auml;nderungen werden beim Verlassen eines ge&auml;nderten Feldes lokal gespeichert. Sie &auml;ndern weder SpoolMan noch AMS oder Verbrauch.</p>
      <div id="inventory-editor-fields" class="row g-2"></div>
    </aside>
  </div>
</section>
<script id="inventory-data" type="application/json">{{ inventory_rows|tojson }}</script>
<script id="local-filament-data" type="application/json">{{ inventory_filaments|tojson }}</script>
<script id="local-vendor-data" type="application/json">{{ inventory_vendors|tojson }}</script>
<script id="local-material-data" type="application/json">{{ inventory_materials|tojson }}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const inventory = JSON.parse(document.getElementById('inventory-data').textContent);
  const localFilaments = new Map(JSON.parse(document.getElementById('local-filament-data').textContent).map(item => [String(item.id), item]));
  const vendors = JSON.parse(document.getElementById('local-vendor-data').textContent);
  const materials = JSON.parse(document.getElementById('local-material-data').textContent);
  const groupsNode = document.getElementById('inventory-groups');
  const editor = document.getElementById('inventory-inline-editor');
  const editorTitle = document.getElementById('inventory-editor-title');
  const editorState = document.getElementById('inventory-editor-state');
  const editorFields = document.getElementById('inventory-editor-fields');
  const groupSelect = document.getElementById('inventory-group-select');
  const sortSelect = document.getElementById('inventory-sort-select');
  const search = document.getElementById('inventory-search');
  const stateKey = 'm0bambospool-inventory-group-view';
  let selectedFilamentId = null;
  let savedState = {};
  try { savedState = JSON.parse(localStorage.getItem(stateKey) || '{}'); } catch (_) {}
  groupSelect.value = ['filament', 'vendor', 'material', 'none'].includes(savedState.group) ? savedState.group : 'filament';
  sortSelect.value = ['last-used', 'name', 'remaining'].includes(savedState.sort) ? savedState.sort : 'last-used';

  const text = value => String(value ?? '');
  const filamentOf = entry => entry.spool?.filament || {};
  const vendorOf = entry => filamentOf(entry).vendor?.name || 'Unbekannt';
  const materialOf = entry => filamentOf(entry).material || 'Unbekannt';
  const filamentNameOf = entry => filamentOf(entry).name || 'Ohne Namen';
  const formatWeight = grams => { const value = Number(grams || 0); if (value < 1000) return `${value.toFixed(1)} g`; const kilograms = Math.round(value / 10) / 100; return `${Number.isInteger(kilograms) ? kilograms.toFixed(0) : kilograms.toFixed(2).replace(/0+$/, '').replace(/\.$/, '')} kg`; };
  const relativeDate = value => {
    if (!value) return 'unbenutzt';
    const date = new Date(value.replace(' ', 'T'));
    const minutes = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
    if (minutes < 60) return `verwendet vor ${minutes} Min.`;
    if (minutes < 1440) return `verwendet vor ${Math.round(minutes / 60)} Std.`;
    return `verwendet vor ${Math.round(minutes / 1440)} Tg.`;
  };
  const persistView = () => { try { localStorage.setItem(stateKey, JSON.stringify({ group: groupSelect.value, sort: sortSelect.value })); } catch (_) {} };
  const make = (tag, className, value) => { const node = document.createElement(tag); if (className) node.className = className; if (value !== undefined) node.textContent = value; return node; };

  function groupEntries() {
    const term = search.value.trim().toLocaleLowerCase();
    const filtered = inventory.filter(entry => [filamentNameOf(entry), vendorOf(entry), materialOf(entry)].join(' ').toLocaleLowerCase().includes(term));
    const groups = new Map();
    filtered.forEach(entry => {
      const filament = filamentOf(entry);
      let key; let label;
      if (groupSelect.value === 'vendor') { key = `vendor:${vendorOf(entry)}`; label = vendorOf(entry); }
      else if (groupSelect.value === 'material') { key = `material:${materialOf(entry)}`; label = materialOf(entry); }
      else if (groupSelect.value === 'none') { key = `spool:${entry.spool.id}`; label = filamentNameOf(entry); }
      else { key = `filament:${filament.id}`; label = filamentNameOf(entry); }
      if (!groups.has(key)) groups.set(key, { key, label, entries: [] });
      groups.get(key).entries.push(entry);
    });
    const sorted = [...groups.values()];
    sorted.forEach(group => group.entries.sort((left, right) => Number(right.spool.remaining_weight || 0) - Number(left.spool.remaining_weight || 0)));
    const latest = group => Math.max(...group.entries.map(entry => Date.parse((entry.last_used || '').replace(' ', 'T')) || 0));
    sorted.sort((left, right) => {
      if (sortSelect.value === 'remaining') return right.entries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0) - left.entries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0);
      if (sortSelect.value === 'name') return left.label.localeCompare(right.label, undefined, { sensitivity: 'base' });
      return latest(right) - latest(left) || left.label.localeCompare(right.label, undefined, { sensitivity: 'base' });
    });
    return sorted;
  }

  function selectFilament(filamentId) {
    const record = localFilaments.get(String(filamentId));
    if (!record) { editor.hidden = false; editorTitle.textContent = 'Kein lokaler Filamenteintrag'; editorState.textContent = 'Nicht editierbar'; editorFields.replaceChildren(make('p', 'text-muted mb-0', 'F\u00fcr dieses Filament liegt noch kein lokaler Stammdatensatz vor.')); return; }
    selectedFilamentId = String(filamentId);
    editor.hidden = false;
    editorTitle.textContent = `${record.vendor_name || 'Unbekannt'} \u00b7 ${record.name}`;
    editorState.textContent = '';
    editorFields.replaceChildren();
    const fieldDefinitions = [
      ['name', 'Name', 'text'], ['vendor_id', 'Hersteller', 'select', vendors], ['material_id', 'Material', 'select', materials], ['color_hex', 'Farbe', 'color'],
      ['diameter', 'Durchmesser (mm)', 'number'], ['density', 'Dichte (g/cm\u00b3)', 'number'], ['weight', 'Gewicht (g)', 'number'], ['spool_weight', 'Leergewicht Spule (g)', 'number'], ['price', 'Preis (EUR)', 'number'],
      ['nozzle_temp', 'D\u00fcsentemperatur (\u00b0C)', 'number'], ['bed_temp', 'Bett-Temperatur (\u00b0C)', 'number'], ['extruder_temp', 'Extruder-Temperatur (\u00b0C)', 'number'], ['cali_idx', 'Kalibrierungsindex', 'number'],
      ['bambu_filament_id', 'Bambu Filament-ID', 'text'], ['bambu_setting_id', 'Bambu Setting-ID', 'text']
    ];
    fieldDefinitions.forEach(([name, label, type, options]) => {
      const wrap = make('div', name === 'name' ? 'col-12' : 'col-12 col-md-6');
      const labelNode = make('label', 'form-label small mb-1', label);
      let input;
      if (type === 'select') {
        input = document.createElement('select'); input.className = 'form-select form-select-sm';
        input.append(new Option('â€”', ''));
        options.forEach(option => input.append(new Option(option.name, option.id)));
        input.value = record[name] ?? '';
      } else {
        input = document.createElement('input'); input.className = type === 'color' ? 'form-control form-control-color' : 'form-control form-control-sm'; input.type = type;
        if (type === 'number') input.step = 'any';
        input.value = type === 'color' ? `#${text(record[name] || '000000').replace(/^#/, '')}` : (record[name] ?? '');
      }
      input.name = name;
      input.dataset.originalValue = input.value;
      input.addEventListener('change', async () => {
        const value = input.value;
        if (value === input.dataset.originalValue) return;
        input.disabled = true; editorState.textContent = 'Speichert â€¦';
        try {
          const response = await fetch(`/inventory/local-filaments/${selectedFilamentId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [name]: value }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Speichern fehlgeschlagen.');
          localFilaments.set(String(result.filament.id), result.filament);
          input.dataset.originalValue = value;
          editorState.textContent = 'Gespeichert';
        } catch (error) { editorState.textContent = error.message; input.value = input.dataset.originalValue; }
        finally { input.disabled = false; }
      });
      wrap.append(labelNode, input); editorFields.append(wrap);
    });
  }

  function render() {
    persistView(); groupsNode.replaceChildren();
    const groups = groupEntries();
    if (!groups.length) { groupsNode.append(make('p', 'text-muted p-3', 'Keine Filamente gefunden.')); return; }
    groups.forEach(group => {
      const first = group.entries[0]; const firstFilament = filamentOf(first);
      const total = group.entries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0);
      const details = make('details', 'inventory-group'); details.open = true;
      const summary = make('summary', 'inventory-group-summary');
      const color = make('span', 'inventory-group-color'); color.style.backgroundColor = `#${text(firstFilament.color_hex || '000000').replace('#', '')}`;
      const copy = make('span', 'inventory-group-copy'); const name = make('strong', '', group.label); const meta = make('span', 'inventory-group-meta', groupSelect.value === 'filament' || groupSelect.value === 'none' ? `${vendorOf(first)} \u00b7 ${materialOf(first)} \u00b7 ${firstFilament.diameter || '1.75'} mm` : (groupSelect.value === 'vendor' ? 'Herstellergruppe' : 'Materialgruppe')); copy.append(name, meta);
      const totalNode = make('span', 'inventory-group-total'); totalNode.append(make('strong', '', formatWeight(total)), make('small', '', `${group.entries.length} ${group.entries.length === 1 ? 'Spule' : 'Spulen'}`));
      summary.append(color, copy, totalNode); details.append(summary);
      const list = make('div', 'inventory-spool-list');
      group.entries.forEach(entry => {
        const filament = filamentOf(entry); const button = make('button', 'inventory-spool-row'); button.type = 'button'; button.dataset.filamentId = filament.id || '';
        const left = make('span', 'inventory-spool-left'); left.append(make('strong', '', `#${entry.spool.id}`), make('small', '', `${filamentNameOf(entry)} \u00b7 ${relativeDate(entry.last_used)}`));
        const maximum = Number(entry.spool.initial_weight || filament.weight || entry.spool.remaining_weight || 1); const percent = Math.max(0, Math.min(100, Number(entry.spool.remaining_weight || 0) / maximum * 100));
        const bar = make('span', 'inventory-spool-bar'); const fill = make('i'); fill.style.width = `${percent}%`; bar.append(fill);
        const remaining = make('span', 'inventory-spool-remaining', formatWeight(entry.spool.remaining_weight));
        button.append(left, bar, remaining); button.addEventListener('click', () => selectFilament(filament.id)); list.append(button);
      });
      details.append(list); groupsNode.append(details);
    });
  }
  [groupSelect, sortSelect].forEach(control => control.addEventListener('change', render));
  search.addEventListener('input', render);
  render();
});
</script>
{% endblock %}
