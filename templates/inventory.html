{% extends "base.html" %}
{% block content %}
<section class="inventory-workspace" aria-label="{{ _('Inventar') }}">
  <div class="inventory-toolbar">
    <label class="inventory-control">{{ _('Gruppieren') }}
      <select id="inventory-group-select" class="form-select form-select-sm">
        <option value="filament">{{ _('Filament') }}</option>
        <option value="vendor">{{ _('Hersteller') }}</option>
        <option value="material">{{ _('Material') }}</option>
        <option value="none">{{ _('Keine Gruppierung') }}</option>
      </select>
    </label>
    <label class="inventory-control">{{ _('Sortieren nach') }}
      <select id="inventory-sort-select" class="form-select form-select-sm">
        <option value="last-used">{{ _('Letzte Verwendung') }}</option>
        <option value="name">{{ _('Name') }}</option>
        <option value="spool-id">{{ _('Spulennummer') }}</option>
        <option value="assignment">{{ _('Zuordnungsstatus') }}</option>
        <option value="remaining">{{ _('Restgewicht') }}</option>
      </select>
    </label>
    <label class="inventory-control">{{ _('Richtung') }}
      <select id="inventory-sort-direction" class="form-select form-select-sm">
        <option value="descending">{{ _('Absteigend') }}</option>
        <option value="ascending">{{ _('Aufsteigend') }}</option>
      </select>
    </label>
    <label class="inventory-control inventory-search">{{ _('Filtern') }}
      <input id="inventory-search" class="form-control form-control-sm" type="search" placeholder="{{ _('Filament, Hersteller oder Material') }}">
    </label>
    <label class="inventory-archived-toggle"><input id="inventory-show-archived" type="checkbox"><span>{{ _('Archivierte anzeigen') }}</span></label>
  </div>
  <div class="inventory-layout">
    <div id="inventory-groups" class="inventory-groups" aria-live="polite"></div>
    <aside id="inventory-inline-editor" class="inventory-inline-editor" hidden aria-live="polite">
      <div class="inventory-editor-heading">
        <div><h2 id="inventory-editor-title" class="h5 mb-0"></h2></div>
        <div class="inventory-editor-actions">
          <span id="inventory-editor-state" class="small text-muted"></span>
          <button id="inventory-create-context" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden></button>
          <button id="inventory-create-spool" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden></button>
          <button id="inventory-open-filament" class="btn btn-sm btn-outline-primary inventory-icon-button" type="button" hidden aria-label="{{ _('Filament öffnen') }}" title="{{ _('Filament öffnen') }}"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></button>
          <button id="inventory-duplicate-filament" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden></button>
          <button id="inventory-duplicate-spool" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden aria-label="{{ _('Spule duplizieren') }}" title="{{ _('Spule duplizieren') }}"><i class="bi bi-copy" aria-hidden="true"></i></button>
          <button id="inventory-delete-spool" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden aria-label="{{ _('Spule löschen') }}" title="{{ _('Spule löschen') }}"><i class="bi bi-trash3" aria-hidden="true"></i></button>
          <button id="inventory-adjust-stock" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden aria-label="{{ _('Bestand verändern') }}" title="{{ _('Bestand verändern') }}"><i class="bi bi-sliders" aria-hidden="true"></i></button>
          <button id="inventory-assign-ams" class="btn btn-sm btn-primary inventory-icon-button" type="button" hidden aria-label="{{ _('In AMS') }}" title="{{ _('In AMS') }}"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i></button>
        </div>
      </div>
      <div id="inventory-current-weight" class="inventory-current-weight" hidden>
        <div class="inventory-current-weight-heading"><span>{{ _('Aktuelles Gewicht (g)') }}</span><strong id="inventory-current-weight-value"></strong></div>
        <div class="inventory-current-weight-bar" role="progressbar" aria-label="{{ _('Aktuelles Spulengewicht') }}"><i id="inventory-current-weight-fill"></i></div>
      </div>
      <div id="inventory-stock-adjustment" class="inventory-stock-adjustment" hidden>
        <div class="inventory-stock-tabs" role="tablist" aria-label="{{ _('Bestandskorrektur') }}">
          <button type="button" class="btn btn-sm btn-primary" data-stock-mode="delta">{{ _('Gewicht') }}</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-stock-mode="absolute">{{ _('Gemessenes Gewicht') }}</button>
        </div>
        <div class="inventory-stock-entry">
          <label id="inventory-stock-label" class="form-label small mb-0" for="inventory-stock-value">{{ _('Neues Gesamtgewicht') }}</label>
          <div class="input-group input-group-sm">
            <input id="inventory-stock-value" class="form-control" type="text" inputmode="decimal" autocomplete="off">
            <span class="input-group-text">g</span>
          </div>
          <button id="inventory-stock-apply" class="btn btn-sm btn-primary" type="button">{{ _('OK') }}</button>
        </div>
        <div id="inventory-stock-help" class="small text-muted">{{ _('Gesamtgewicht der Spule plus Restfilament, wie von einer Waage abgelesen.') }}</div>
      </div>
      <div id="inventory-editor-fields" class="row g-2"></div>
      <section id="inventory-spool-prints" class="inventory-spool-prints" hidden aria-labelledby="inventory-spool-prints-title">
        <div id="inventory-spool-prints-title" class="inventory-spool-prints-title">{{ _('Drucke dieser Spule') }}</div>
        <div id="inventory-spool-prints-list" class="inventory-spool-prints-list"></div>
      </section>
    </aside>
  </div>
</section>
<script id="inventory-data" type="application/json">{{ inventory_rows|tojson }}</script>
<script id="local-filament-data" type="application/json">{{ inventory_filaments|tojson }}</script>
<script id="local-vendor-data" type="application/json">{{ inventory_vendors|tojson }}</script>
<script id="local-material-data" type="application/json">{{ inventory_materials|tojson }}</script>
<script id="local-spool-data" type="application/json">{{ inventory_spools|tojson }}</script>
<script id="inventory-color-data" type="application/json">{{ inventory_colors|tojson }}</script>
<script id="inventory-active-tray-data" type="application/json">{{ active_tray_options|tojson }}</script>
<script id="inventory-nfc-tag-data" type="application/json">{{ inventory_nfc_tags|tojson }}</script>
<script id="inventory-fill-context" type="application/json">{{ inventory_fill_context|tojson }}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const inventory = JSON.parse(document.getElementById('inventory-data').textContent);
  const localFilaments = new Map(JSON.parse(document.getElementById('local-filament-data').textContent).map(item => [String(item.id), item]));
  const localVendors = new Map(JSON.parse(document.getElementById('local-vendor-data').textContent).map(item => [String(item.id), item]));
  const localSpools = new Map(JSON.parse(document.getElementById('local-spool-data').textContent).map(item => [String(item.id), item]));
  const materials = JSON.parse(document.getElementById('local-material-data').textContent);
  const colorOptions = JSON.parse(document.getElementById('inventory-color-data').textContent);
  const activeTrayOptions = JSON.parse(document.getElementById('inventory-active-tray-data').textContent);
  const nfcTagOptions = JSON.parse(document.getElementById('inventory-nfc-tag-data').textContent);
  const inventoryFillContext = JSON.parse(document.getElementById('inventory-fill-context').textContent || 'null');
  const activePrintRunning = {{ active_print_running|tojson }};
  const inventoryText = {
    unused: {{ _('unbenutzt')|tojson }},
    usedMinutes: {{ _('verwendet vor %s Min.')|tojson }},
    usedHours: {{ _('verwendet vor %s Std.')|tojson }},
    usedDays: {{ _('verwendet vor %s Tg.')|tojson }},
    unknown: {{ _('Unbekannt')|tojson }},
    unnamed: {{ _('Ohne Namen')|tojson }},
    currentColor: {{ _('Aktuell (#%s)')|tojson }},
    saveFailed: {{ _('Speichern fehlgeschlagen.')|tojson }},
    saving: {{ _('Speichert …')|tojson }},
    saved: {{ _('Gespeichert')|tojson }},
    noPrints: {{ _('Keine Drucke zugeordnet.')|tojson }},
    print: {{ _('Druck')|tojson }},
    minutes: {{ _('Min.')|tojson }},
    completed: {{ _('COMPLETED')|tojson }},
    noFilaments: {{ _('Keine Filamente gefunden.')|tojson }},
    manufacturerGroup: {{ _('Herstellergruppe')|tojson }},
    materialGroup: {{ _('Materialgruppe')|tojson }},
    spool: {{ _('Spule')|tojson }},
    spools: {{ _('Spulen')|tojson }},
    noSpool: {{ _('Keine Spule')|tojson }},
    boundLocked: {{ _('Spule ist in der AMS gebunden und gesperrt.')|tojson }},
    nfcBound: {{ _('Per NFC identifiziert und gesperrt')|tojson }},
    creating: {{ _('Legt an …')|tojson }},
    duplicating: {{ _('Dupliziert …')|tojson }},
    duplicateFailed: {{ _('Duplizieren fehlgeschlagen.')|tojson }},
    deleting: {{ _('Löscht …')|tojson }},
    deleteConfirm: {{ _('Spule #%s wirklich löschen?')|tojson }},
    deleteFailed: {{ _('Löschen fehlgeschlagen.')|tojson }},
    filamentCurrentPrint: {{ _('Filament (aktueller Druck)')|tojson }},
    filament: {{ _('Filament')|tojson }},
    filamentDefault: {{ _('Filament-Standard')|tojson }},
    weight: {{ _('Gewicht (g)')|tojson }},
    emptySpoolWeight: {{ _('Leergewicht Spule (g)')|tojson }},
    price: {{ _('Preis (EUR)')|tojson }},
    correction: {{ _('Gewicht korrigieren (g)')|tojson }},
    adjustStock: {{ _('Bestand verändern')|tojson }},
    lastUsed: {{ _('Letzte Verwendung')|tojson }},
    activeTray: {{ _('Aktives Fach')|tojson }},
    activeTrayLocked: {{ _('Das aktive Fach kann während eines Drucks nicht geändert werden.')|tojson }},
    activeTrayReadOnly: {{ _('Die Fachzuordnung erfolgt ausschließlich auf der AMS-Seite.')|tojson }},
    nfcTag: {{ _('NFC-Tag')|tojson }},
    nfcTagLocked: {{ _('Der NFC-Tag kann während eines Drucks nicht geändert werden.')|tojson }},
    archived: {{ _('Archiviert')|tojson }},
    diameter: {{ _('Durchmesser (mm)')|tojson }},
    nozzleTemperatureFrom: {{ _('Düsentemperatur Min. (°C)')|tojson }},
    nozzleTemperatureTo: {{ _('Düsentemperatur Max. (°C)')|tojson }},
    nozzleTemperatureMin: {{ _('Düsentemperatur Min. (°C)')|tojson }},
    nozzleTemperatureMax: {{ _('Düsentemperatur Max. (°C)')|tojson }},
    color: {{ _('Farbe')|tojson }},
    material: {{ _('Material')|tojson }},
    manufacturer: {{ _('Hersteller')|tojson }},
    stockCorrectionFailed: {{ _('Bestandskorrektur fehlgeschlagen.')|tojson }},
    boundDelete: {{ _('Gebundene Spulen können nicht gelöscht werden.')|tojson }},
    boundChange: {{ _('Gebundene Spulen können nicht verändert werden.')|tojson }},
    assignAms: {{ _('In AMS')|tojson }},
    assigningAms: {{ _('Wird dem AMS zugeordnet …')|tojson }},
    assignAmsFailed: {{ _('Die Spule konnte dem AMS nicht zugeordnet werden.')|tojson }},
    selectForAms: {{ _('Spule für AMS-Fach auswählen')|tojson }}
  };
  const vendorIdByName = new Map([...localVendors.values()].map(item => [String(item.name || '').toLocaleLowerCase(), String(item.id)]));
  const groupsNode = document.getElementById('inventory-groups');
  const editor = document.getElementById('inventory-inline-editor');
  const editorTitle = document.getElementById('inventory-editor-title');
  const editorState = document.getElementById('inventory-editor-state');
  const editorFields = document.getElementById('inventory-editor-fields');
  const groupSelect = document.getElementById('inventory-group-select');
  const sortSelect = document.getElementById('inventory-sort-select');
  const sortDirection = document.getElementById('inventory-sort-direction');
  const search = document.getElementById('inventory-search');
  const showArchived = document.getElementById('inventory-show-archived');
  const createContextButton = document.getElementById('inventory-create-context');
  const createSpoolButton = document.getElementById('inventory-create-spool');
  const duplicateFilamentButton = document.getElementById('inventory-duplicate-filament');
  const duplicateSpoolButton = document.getElementById('inventory-duplicate-spool');
  const deleteSpoolButton = document.getElementById('inventory-delete-spool');
  const openFilamentButton = document.getElementById('inventory-open-filament');
  const adjustStockButton = document.getElementById('inventory-adjust-stock');
  const assignAmsButton = document.getElementById('inventory-assign-ams');
  const stockAdjustment = document.getElementById('inventory-stock-adjustment');
  const stockValue = document.getElementById('inventory-stock-value');
  const stockLabel = document.getElementById('inventory-stock-label');
  const stockHelp = document.getElementById('inventory-stock-help');
  const stockApply = document.getElementById('inventory-stock-apply');
  const currentWeight = document.getElementById('inventory-current-weight');
  const currentWeightValue = document.getElementById('inventory-current-weight-value');
  const currentWeightFill = document.getElementById('inventory-current-weight-fill');
  const spoolPrints = document.getElementById('inventory-spool-prints');
  const spoolPrintsList = document.getElementById('inventory-spool-prints-list');
  const stockModeButtons = [...document.querySelectorAll('[data-stock-mode]')];
  let stockMode = 'delta';
  const setStockMode = mode => {
    stockMode = mode === 'delta' ? 'delta' : 'absolute';
    stockModeButtons.forEach(button => {
      const active = button.dataset.stockMode === stockMode;
      button.classList.toggle('btn-primary', active);
      button.classList.toggle('btn-outline-secondary', !active);
    });
    stockLabel.textContent = stockMode === 'delta' ? {{ _('Verbrauchsmenge')|tojson }} : {{ _('Neues Gesamtgewicht')|tojson }};
    stockHelp.textContent = stockMode === 'delta'
      ? {{ _('Positive Werte verbrauchen Filament, negative Werte buchen Filament zurück.')|tojson }}
      : {{ _('Gesamtgewicht der Spule plus Restfilament, wie von einer Waage abgelesen.')|tojson }};
    stockValue.value = '';
  };
  stockModeButtons.forEach(button => button.addEventListener('click', () => setStockMode(button.dataset.stockMode)));
  setStockMode('delta');
  const stateKey = 'm0bambospool-inventory-group-view';
  let selectedEditor = null;
  let savedState = {};
  try { savedState = JSON.parse(localStorage.getItem(stateKey) || '{}'); } catch (_) {}
  // Reset only the expanded-group state once after migrating away from native
  // details elements; grouping, sorting, direction and filter preferences stay.
  if (savedState.groupLayoutVersion !== 2) {
    savedState.openGroups = {};
    savedState.groupLayoutVersion = 2;
  }
  groupSelect.value = ['filament', 'vendor', 'material', 'none'].includes(savedState.group) ? savedState.group : 'filament';
  sortSelect.value = ['last-used', 'name', 'spool-id', 'assignment', 'remaining'].includes(savedState.sort) ? savedState.sort : 'last-used';
  sortDirection.value = ['ascending', 'descending'].includes(savedState.direction) ? savedState.direction : 'descending';
  showArchived.checked = Boolean(savedState.showArchived);

  const text = value => String(value ?? '');
  const filamentOf = entry => entry.spool?.filament || {};
  const vendorOf = entry => filamentOf(entry).vendor?.name || inventoryText.unknown;
  const materialOf = entry => filamentOf(entry).material || inventoryText.unknown;
  const filamentNameOf = entry => filamentOf(entry).name || inventoryText.unnamed;
  const numberLocale = document.documentElement.lang.startsWith('de') ? 'de-DE' : 'en-US';
  const formatDecimal = value => Number(value).toLocaleString(numberLocale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const formatWeight = grams => { const value = Number(grams || 0); if (value < 1000) return `${formatDecimal(value)} g`; return `${formatDecimal(value / 1000)} kg`; };
  const relativeDate = value => {
    if (!value) return inventoryText.unused;
    const date = new Date(value.replace(' ', 'T'));
    const minutes = Math.max(0, Math.round((Date.now() - date.getTime()) / 60000));
    if (minutes < 60) return inventoryText.usedMinutes.replace('%s', String(minutes));
    if (minutes < 1440) return inventoryText.usedHours.replace('%s', String(Math.round(minutes / 60)));
    return inventoryText.usedDays.replace('%s', String(Math.round(minutes / 1440)));
  };
  const make = (tag, className, value) => { const node = document.createElement(tag); if (className) node.className = className; if (value !== undefined) node.textContent = value; return node; };
  const storeView = () => { try { localStorage.setItem(stateKey, JSON.stringify(savedState)); } catch (_) {} };
  const updateSelectionMarker = () => {
    document.querySelectorAll('.inventory-selectable.is-selected').forEach(node => node.classList.remove('is-selected'));
    if (!selectedEditor) return;
    const selector = `.inventory-selectable[data-selection-kind="${CSS.escape(selectedEditor.kind)}"][data-selection-id="${CSS.escape(selectedEditor.id)}"]`;
    document.querySelectorAll(selector).forEach(node => node.classList.add('is-selected'));
  };
  const rememberOpenGroups = () => {
    document.querySelectorAll('.inventory-group[data-group-mode][data-group-key]').forEach(details => {
      const mode = details.dataset.groupMode;
      if (!savedState.openGroups || typeof savedState.openGroups !== 'object') savedState.openGroups = {};
      if (!savedState.openGroups[mode] || typeof savedState.openGroups[mode] !== 'object') savedState.openGroups[mode] = {};
      savedState.openGroups[mode][details.dataset.groupKey] = details.dataset.open === 'true';
    });
  };
  const persistView = () => {
    rememberOpenGroups();
    savedState.group = groupSelect.value;
    savedState.sort = sortSelect.value;
    savedState.direction = sortDirection.value;
    savedState.showArchived = showArchived.checked;
    storeView();
  };
  const localColor = value => text(value || '000000').replace(/^#/, '').toUpperCase();
  const formatEditorNumber = (name, value) => {
    if (value === null || value === undefined || value === '') return '0.00';
    const number = Number(value);
    if (!Number.isFinite(number)) return value;
    return formatDecimal(number);
  };
  const formatDisplayDateTime = value => {
    if (!value) return '';
    const date = new Date(String(value).replace(' ', 'T'));
    if (Number.isNaN(date.getTime())) return String(value);
    const language = String(document.documentElement.lang || 'de').toLowerCase();
    const locale = language.startsWith('en') ? 'en-US' : 'de-DE';
    return new Intl.DateTimeFormat(locale, {
      dateStyle: 'short',
      timeStyle: 'short',
      hour12: locale === 'en-US',
    }).format(date);
  };
  const moneyOrWeightField = name => name === 'price' || name.includes('weight');

  function groupEntries() {
    const term = search.value.trim().toLocaleLowerCase();
    const isArchived = entry => localSpools.get(String(entry.spool?.id))?.archived ?? Boolean(entry.spool?.archived);
    const visibleInventory = showArchived.checked ? inventory : inventory.filter(entry => !isArchived(entry));
    const remoteFilamentIds = new Set(visibleInventory.map(entry => String(filamentOf(entry).id)));
    const localOnlyEntries = [...localFilaments.values()]
      .filter(filament => !remoteFilamentIds.has(String(filament.id)))
      .map(filament => ({
        localOnly: true,
        spool: { id: null, remaining_weight: 0, initial_weight: 0, filament: { ...filament, vendor: { id: filament.vendor_id, name: filament.vendor_name }, material: filament.material_name } },
        last_used: null,
      }));
    const filtered = [...visibleInventory, ...localOnlyEntries]
      .filter(entry => [filamentNameOf(entry), vendorOf(entry), materialOf(entry)].join(' ').toLocaleLowerCase().includes(term));
    const groups = new Map();
    filtered.forEach(entry => {
      const filament = filamentOf(entry);
      let key; let label;
      if (groupSelect.value === 'vendor') { key = `vendor:${vendorOf(entry)}`; label = vendorOf(entry); }
      else if (groupSelect.value === 'material') { key = `material:${materialOf(entry)}`; label = materialOf(entry); }
      else if (groupSelect.value === 'none') { key = entry.localOnly ? `filament:${filament.id}` : `spool:${entry.spool.id}`; label = filamentNameOf(entry); }
      else { key = `filament:${filament.id}`; label = filamentNameOf(entry); }
      if (!groups.has(key)) groups.set(key, { key, label, entries: [] });
      groups.get(key).entries.push(entry);
    });
    const sorted = [...groups.values()];
    const direction = sortDirection.value === 'ascending' ? 1 : -1;
    const usedAt = entry => Date.parse((entry.last_used || '').replace(' ', 'T')) || 0;
    const compareText = (left, right) => String(left || '').localeCompare(String(right || ''), undefined, { sensitivity: 'base' });
    const spoolId = entry => Number(entry.spool?.id || 0);
    const assignmentRank = entry => {
      if (entry.localOnly) return 3;
      if (entry.spool?.active_print_locked) return 0;
      const activeTray = String(entry.spool?.active_tray || '').replace(/^"|"$/g, '').trim();
      return activeTray || entry.spool?.active_ams_locked ? 1 : 2;
    };
    const compareByName = (left, right) => {
      const leftFilament = filamentOf(left);
      const rightFilament = filamentOf(right);
      let result = 0;
      if (groupSelect.value === 'vendor') {
        result = compareText(filamentNameOf(left), filamentNameOf(right));
      } else if (groupSelect.value === 'material') {
        result = compareText(vendorOf(left), vendorOf(right))
          || compareText(filamentNameOf(left), filamentNameOf(right));
      } else if (groupSelect.value === 'none') {
        result = compareText(vendorOf(left), vendorOf(right))
          || compareText(materialOf(left), materialOf(right))
          || compareText(filamentNameOf(left), filamentNameOf(right));
      } else {
        result = compareText(leftFilament.name, rightFilament.name);
      }
      return result || spoolId(left) - spoolId(right);
    };
    sorted.forEach(group => group.entries.sort((left, right) => {
      if (sortSelect.value === 'name') return direction * compareByName(left, right);
      if (sortSelect.value === 'spool-id') return direction * (spoolId(left) - spoolId(right));
      if (sortSelect.value === 'assignment') return direction * (assignmentRank(left) - assignmentRank(right) || spoolId(left) - spoolId(right));
      const byLastUse = direction * (usedAt(left) - usedAt(right));
      if (byLastUse) return byLastUse;
      return direction * (spoolId(left) - spoolId(right));
    }));
    const latest = group => Math.max(...group.entries.map(entry => Date.parse((entry.last_used || '').replace(' ', 'T')) || 0));
    sorted.sort((left, right) => {
      if (sortSelect.value === 'remaining') return direction * (left.entries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0) - right.entries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0));
      if (sortSelect.value === 'name') return direction * compareByName(left.entries[0], right.entries[0]);
      if (sortSelect.value === 'spool-id') return direction * (Math.min(...left.entries.map(spoolId)) - Math.min(...right.entries.map(spoolId)));
      if (sortSelect.value === 'assignment') return direction * (Math.min(...left.entries.map(assignmentRank)) - Math.min(...right.entries.map(assignmentRank)) || compareText(left.label, right.label));
      return direction * (latest(left) - latest(right)) || direction * compareText(left.label, right.label);
    });
    return sorted;
  }

  function buildInput(definition, record, save) {
    const [name, label, type, options, locked] = definition;
    const filamentDefaultField = { initial_weight: 'weight', spool_weight: 'spool_weight', price: 'price' }[name];
    const filamentDefaultValue = filamentDefaultField ? record.filament?.[filamentDefaultField] : null;
    const hasFilamentDefault = filamentDefaultValue !== null && filamentDefaultValue !== undefined;
    const defaultFromFilament = Boolean(record.filament_defaults?.[name]);
    const wrap = make('div', name === 'name' || name === 'nfc_tag_id' || name === 'active_tray' ? 'col-12' : 'col-12 col-md-6');
    wrap.dataset.fieldWrap = name;
    const labelNode = make('label', 'form-label small mb-1', label);
    let input;
    let colorPreview;
    let clearingToDefault = false;
    if (type === 'readonly') {
      input = document.createElement('input');
      input.type = 'text';
      input.className = 'form-control form-control-sm inventory-readonly';
      const current = String(record[name] || '').replace(/^"|"$/g, '').trim();
      const currentOption = (options || []).find(option => String(option.value) === current);
      input.value = currentOption?.label || current || '—';
      input.readOnly = true;
      input.setAttribute('aria-readonly', 'true');
      input.title = inventoryText.activeTrayReadOnly;

  async function deleteSpool(spool) {
    if (spool.active_print_locked || spool.active_ams_locked || spool.nfc_ams_locked || !window.confirm(inventoryText.deleteConfirm.replace('%s', String(spool.id)))) return;
    deleteSpoolButton.disabled = true;
    editorState.textContent = inventoryText.deleting;
    try {
      const response = await fetch(`/inventory/local-spools/${spool.id}`, { method: 'DELETE' });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || inventoryText.deleteFailed);
      localSpools.delete(String(spool.id));
      const index = inventory.findIndex(item => String(item.spool?.id) === String(spool.id));
      if (index >= 0) inventory.splice(index, 1);
      selectedEditor = null;
      editor.hidden = true;
      render();
    } catch (error) {
      editorState.textContent = error.message || inventoryText.deleteFailed;
      deleteSpoolButton.disabled = false;
    }
  }

  function selectGroup(group) {
    const first = group.entries[0];
    if (groupSelect.value === 'vendor') {
      const id = vendorIdByName.get(vendorOf(first).toLocaleLowerCase());
      if (id) selectEditor('vendor', id);
      return true;
    }
    if (groupSelect.value === 'filament') {
      selectEditor('filament', filamentOf(first).id);
      return true;
    }
    if (groupSelect.value === 'none') {
      if (first.localOnly) selectEditor('filament', filamentOf(first).id);
      else selectEditor('spool', first.spool.id);
      return true;
    }
    return false;
  }

  function renderSpoolRow(entry, mode) {

    button.type = 'button';

    button.classList.add('inventory-selectable');
    button.dataset.selectionKind = 'spool';

    const nfcLocked = Boolean(entry.spool.nfc_ams_locked);
    const spoolInUse = Boolean(entry.spool.active_print_locked || entry.spool.active_ams_locked || nfcLocked);
    // The NFC marker describes the spool itself, while the lock describes
    // whether the spool is currently bound in the AMS/print workflow. They
    // are independent states and must therefore be rendered independently.
    const nfcTagId = entry.spool.nfc_tag_id;
    const nfcTagValue = entry.spool.nfc_tag_value || entry.spool.extra?.tag;
    const hasNfcTag = (nfcTagId !== null && nfcTagId !== undefined && String(nfcTagId).trim() !== '')
      || Boolean(nfcTagValue && String(nfcTagValue).replace(/^"|"$/g, '').trim());
    const filament = filamentOf(entry);
    const material = materialOf(entry);
    const vendor = vendorOf(entry);
    const name = filament.name || inventoryText.unnamed;
    const diameter = filament.diameter ? `${formatDecimal(filament.diameter)} mm` : '';
    const title = mode === 'vendor' || mode === 'filament' ? name : `${vendor} · ${name}`;
    const meta = [material, diameter].filter(Boolean).join(' · ');
    const left = make('span', `inventory-spool-left${mode === 'filament' ? ' inventory-spool-left-compact' : ''}`);
    const spoolNumber = make('strong', 'inventory-spool-number', `#${entry.spool.id}`);
    if (spoolInUse) {
      const lock = make('i', 'bi bi-lock-fill inventory-spool-lock');
      lock.setAttribute('aria-hidden', 'true');
      const lockTitle = nfcLocked
        ? inventoryText.nfcBound
        : entry.spool.active_print_locked
        ? {{ _('Spule im aktuellen Druck')|tojson }}
        : inventoryText.boundLocked;
      lock.title = lockTitle;
      spoolNumber.append(lock);
      button.title = lockTitle;
    } else {
      // Reserve the lock column so all rows keep the same alignment.
      spoolNumber.append(make('span', 'inventory-spool-icon-placeholder'));
    }
    if (hasNfcTag) {
      const nfcIcon = make('i', 'bi bi-nfc inventory-spool-lock inventory-spool-nfc-lock');
      nfcIcon.setAttribute('aria-hidden', 'true');
      nfcIcon.title = inventoryText.nfcTag;
      nfcIcon.setAttribute('aria-label', inventoryText.nfcTag);
      spoolNumber.append(nfcIcon);
      if (!button.title) button.title = inventoryText.nfcTag;
    } else {
      // Reserve the NFC column independently from the lock column.
      spoolNumber.append(make('span', 'inventory-spool-icon-placeholder'));
    }
    left.append(spoolNumber);
    if (mode !== 'filament') {
      const color = make('span', 'inventory-spool-color');
      color.style.backgroundColor = `#${localColor(filament.color_hex)}`;
      left.append(color);
      const copy = make('span', 'inventory-spool-copy');
      copy.append(make('strong', '', title), make('small', '', meta));
      left.append(copy);
    }
    const maximum = Number(entry.spool.initial_weight || filament.weight || entry.spool.remaining_weight || 1);
    const percent = Math.max(0, Math.min(100, Number(entry.spool.remaining_weight || 0) / maximum * 100));
    const bar = make('span', 'inventory-spool-bar');
    const fill = make('i');
    fill.style.width = `${percent}%`;
    bar.append(fill);
    const progress = make('span', 'inventory-spool-progress');
    progress.append(bar, make('small', 'inventory-spool-used', relativeDate(entry.last_used)));
    button.append(left, progress, make('span', 'inventory-spool-remaining', formatWeight(entry.spool.remaining_weight)));
    if (selectedEditor?.kind === 'spool' && selectedEditor.id === String(entry.spool.id)) button.classList.add('is-selected');
    button.addEventListener('click', () => selectEditor('spool', entry.spool.id));
    return button;
  }

  function render() {
    persistView();
    groupsNode.replaceChildren();
    const groups = groupEntries();
    if (!groups.length) { groupsNode.append(make('p', 'text-muted p-3', inventoryText.noFilaments)); return; }
    if (groupSelect.value === 'none') {
      const list = make('div', 'inventory-spool-list inventory-flat-list');
      groups.flatMap(group => group.entries).forEach(entry => list.append(renderSpoolRow(entry, 'none')));
      groupsNode.append(list);
      updateSelectionMarker();
      return;
    }
    groups.forEach(group => {
      const first = group.entries[0];
      const firstFilament = filamentOf(first);
      const spoolEntries = group.entries.filter(entry => !entry.localOnly);
      const total = spoolEntries.reduce((sum, entry) => sum + Number(entry.spool.remaining_weight || 0), 0);
      // Use an explicit container instead of the browser-native details layout.
      // Native details can lose the expanded content height inside the scroll grid.
      const details = make('div', 'inventory-group');
      details.dataset.groupMode = groupSelect.value;
      details.dataset.groupKey = group.key;
      const rememberedOpen = savedState.openGroups?.[groupSelect.value]?.[group.key];
      const initialOpen = rememberedOpen === undefined ? true : Boolean(rememberedOpen);
      details.dataset.open = String(initialOpen);
      details.classList.toggle('is-open', initialOpen);
      const summary = make('button', 'inventory-group-summary');
      summary.type = 'button';
      summary.classList.add('inventory-selectable');
      const showGroupColor = groupSelect.value === 'filament';
      if (!showGroupColor) summary.classList.add('inventory-group-summary-no-color');
      if (groupSelect.value === 'filament') {
        summary.dataset.selectionKind = 'filament';
        summary.dataset.selectionId = String(firstFilament.id);
      } else if (groupSelect.value === 'vendor') {
        const vendorId = vendorIdByName.get(vendorOf(first).toLocaleLowerCase());
        summary.dataset.selectionKind = 'vendor';
        summary.dataset.selectionId = String(vendorId || '');
      }
      const copy = make('span', 'inventory-group-copy');
      const name = make('strong', '', group.label);
      const meta = make('span', 'inventory-group-meta', groupSelect.value === 'filament' || groupSelect.value === 'none' ? materialOf(first) : (groupSelect.value === 'vendor' ? inventoryText.manufacturerGroup : inventoryText.materialGroup));
      copy.append(name, meta);
      const totalNode = make('span', 'inventory-group-total');
      totalNode.append(make('strong', '', spoolEntries.length ? formatWeight(total) : inventoryText.noSpool), make('small', '', `${spoolEntries.length} ${spoolEntries.length === 1 ? inventoryText.spool : inventoryText.spools}`));
      const disclosure = make('span', 'inventory-group-disclosure', '\u203a');
      disclosure.setAttribute('aria-hidden', 'true');
      if (showGroupColor) {
        const color = make('span', 'inventory-group-color');
        color.style.backgroundColor = `#${localColor(firstFilament.color_hex)}`;
        summary.append(color);
      }
      summary.append(copy, totalNode, disclosure);
      summary.addEventListener('click', event => {
        const open = details.dataset.open !== 'true';
        details.dataset.open = String(open);
        details.classList.toggle('is-open', open);
        list.hidden = !open;
        savedState.openGroups ??= {};
        savedState.openGroups[groupSelect.value] ??= {};
        savedState.openGroups[groupSelect.value][group.key] = open;
        storeView();
        selectGroup(group);
      });
      details.append(summary);
      const list = make('div', 'inventory-spool-list');
      list.hidden = !initialOpen;
      group.entries.forEach(entry => list.append(renderSpoolRow(entry, groupSelect.value)));
      details.append(list);
      groupsNode.append(details);
    });
    updateSelectionMarker();
  }
  [groupSelect, sortSelect, sortDirection].forEach(control => control.addEventListener('change', render));
  showArchived.addEventListener('change', () => { savedState.showArchived = showArchived.checked; render(); });
  search.addEventListener('input', render);
  render();
  const requestedSpoolId = new URLSearchParams(window.location.search).get('spool_id');
  if (requestedSpoolId && localSpools.has(String(requestedSpoolId))) {
    if (localSpools.get(String(requestedSpoolId)).archived && !showArchived.checked) {
      showArchived.checked = true;
      savedState.showArchived = true;
      render();
    }
    selectEditor('spool', requestedSpoolId);
    editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
</script>
{% endblock %}
