{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">{{ _('LiveCam') }}</h1>
<div class="card livecam-card mx-auto">
  <div class="card-header">{{ _('Livebild') }}</div>
  <div class="card-body text-center">
    <div class="livecam-frame border rounded bg-body-secondary d-flex align-items-center justify-content-center">
      <img id="livecam-image" src="" alt="{{ _('Livebild') }}" class="img-fluid d-none" style="max-height: 70vh;" data-stream-url="{{ url_for('livecam_stream') }}">
      <img id="livecam-placeholder" src="{{ url_for('static', filename='livecam-placeholder.png') }}" alt="{{ _('Livebild nicht aktiv – m0BamboSpool @ moquai') }}">
    </div>
    <button id="livecam-toggle" type="button" class="btn btn-sm btn-primary rounded-pill px-3 py-2 mt-3">
      <i class="bi bi-play-fill me-1"></i> {{ _('Start') }}
    </button>
  </div>
</div>
<script>
(() => {
  const image = document.getElementById('livecam-image');
  const placeholder = document.getElementById('livecam-placeholder');
  const button = document.getElementById('livecam-toggle');
  if (!image || !placeholder || !button) return;
  let running = false;
  button.addEventListener('click', () => {
    running = !running;
    if (running) {
      const streamUrl = image.dataset.streamUrl;
      image.src = streamUrl;
      // Das Standbild bleibt sichtbar, bis der Browser den ersten gültigen
      // Frame des MJPEG-Streams tatsächlich geladen hat.
      image.classList.add('d-none');
      placeholder.classList.remove('d-none');
      button.innerHTML = '<i class="bi bi-stop-fill me-1"></i> {{ _('Stop') }}';
    } else {
      image.removeAttribute('src');
      image.classList.add('d-none');
      placeholder.classList.remove('d-none');
      button.innerHTML = '<i class="bi bi-play-fill me-1"></i> {{ _('Start') }}';
    }
  });
  image.addEventListener('load', () => {
    if (!running) return;
    image.classList.remove('d-none');
    placeholder.classList.add('d-none');
  });
  image.addEventListener('error', () => {
    running = false;
    image.removeAttribute('src');
    image.classList.add('d-none');
    placeholder.classList.remove('d-none');
    button.innerHTML = '<i class="bi bi-play-fill me-1"></i> {{ _('Start') }}';
  });
})();
</script>
{% endblock %}
