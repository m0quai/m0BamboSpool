{% extends "base.html" %}
{% block title %}{{ _('NFC-Tags') }}{% endblock %}
{% block content %}
<section class="reference-management" data-nfc-management>
  <div class="reference-management-heading">
    <div>
      <a class="btn btn-sm btn-outline-secondary mb-2" href="{{ url_for('bambu_cloud.index') }}">← {{ _('Einstellungen') }}</a>
      <h1 class="h2 mb-0">{{ _('NFC-Tags') }}</h1>
    </div>
  </div>
  <div id="nfc-feedback" class="alert d-none" role="status"></div>
  <div class="reference-management-layout">
    <div class="reference-management-list-box">
      <div class="reference-management-list-heading">
        <div class="reference-management-list-title"><strong>{{ _('Einträge') }}</strong><button id="nfc-new" class="btn btn-sm btn-primary reference-icon-button" type="button" title="{{ _('NFC-Tag anlegen') }}" aria-label="{{ _('NFC-Tag anlegen') }}"><i class="bi bi-plus-circle" aria-hidden="true"></i></button></div>
        <input id="nfc-search" class="form-control form-control-sm" type="search" placeholder="{{ _('Tag-Wert') }}">
      </div>
      <div id="nfc-list" class="reference-management-list" role="listbox" aria-label="{{ _('NFC-Tags') }}">
        {% for tag in management_rows %}
        <button class="reference-management-item" type="button" data-nfc-id="{{ tag.id }}" role="option">
          <span class="reference-management-item-name">#{{ tag.id }} · {{ tag.comment or tag.tag_value }}</span>
          <small class="text-muted">
            {{ tag.tag_value }}
            {% if tag.spool_number %}
            · <a class="nfc-spool-link" href="{{ url_for('inventory') }}?spool_id={{ tag.spool_number }}" title="{{ _('Spule im Inventar öffnen') }}" onclick="event.stopPropagation()">{{ _('Spule') }} #{{ tag.spool_number }} <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
            {% endif %}
          </small>
        </button>
        {% else %}
        <div class="reference-management-empty">{{ _('Keine Einträge vorhanden.') }}</div>
        {% endfor %}
      </div>
    </div>
    <aside id="nfc-editor" class="reference-management-editor" hidden aria-live="polite">
      <div class="reference-management-editor-heading">
        <div><h2 id="nfc-title" class="h5 mb-0"></h2></div>
        <div class="reference-management-editor-actions">
          <span id="nfc-state" class="small text-muted"></span>
          <button id="nfc-copy" class="btn btn-sm btn-outline-primary reference-icon-button" type="button" title="{{ _('NFC-Tag kopieren') }}" aria-label="{{ _('NFC-Tag kopieren') }}"><i class="bi bi-copy" aria-hidden="true"></i></button>
          <button id="nfc-delete" class="btn btn-sm btn-outline-danger reference-icon-button" type="button" title="{{ _('NFC-Tag löschen') }}" aria-label="{{ _('NFC-Tag löschen') }}"><i class="bi bi-trash3" aria-hidden="true"></i></button>
        </div>
      </div>
      <form id="nfc-form" class="reference-management-form">
        <div class="mb-3"><label class="form-label" for="nfc-value">{{ _('Tag-Wert') }}</label><input id="nfc-value" class="form-control" type="text" required></div>
        <div class="mb-3"><label class="form-label" for="nfc-comment">{{ _('Kommentar') }}</label><input id="nfc-comment" class="form-control" type="text" placeholder="{{ _('Tag-Wert') }}"></div>
      </form>
    </aside>
  </div>
</section>
<script id="nfc-data" type="application/json">{{ management_rows|tojson }}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const records = new Map(JSON.parse(document.getElementById('nfc-data').textContent).map(row => [String(row.id), row]));
  const list = document.getElementById('nfc-list');
  const editor = document.getElementById('nfc-editor');
  const title = document.getElementById('nfc-title');
  const state = document.getElementById('nfc-state');
  const feedback = document.getElementById('nfc-feedback');
  const value = document.getElementById('nfc-value');
  const comment = document.getElementById('nfc-comment');
  const deleteButton = document.getElementById('nfc-delete');
  let selected = null;
  const texts = {
    save: {{ _('Speichern')|tojson }},
    saved: {{ _('Gespeichert.')|tojson }},
    error: {{ _('NFC-Tag konnte nicht gespeichert werden.')|tojson }},
    deleteError: {{ _('NFC-Tag konnte nicht gelöscht werden.')|tojson }},
    confirm: {{ _('Diesen NFC-Tag wirklich löschen?')|tojson }}
  };
  const showError = message => { feedback.textContent = message; feedback.className = 'alert alert-danger'; };
  const refreshItem = record => {
    const item = list.querySelector('[data-nfc-id="' + CSS.escape(String(record.id)) + '"]');
    if (!item) return;
    item.querySelector('.reference-management-item-name').textContent = '#'+record.id+' · '+(record.comment || record.tag_value);
    const details = item.querySelector('small');
    details.replaceChildren(document.createTextNode(record.tag_value));
    if (record.spool_number) {
      details.append(document.createTextNode(' · '));
      const link = document.createElement('a'); link.className = 'nfc-spool-link'; link.href = '/inventory?spool_id=' + encodeURIComponent(record.spool_number); link.title = {{ _('Spule im Inventar öffnen')|tojson }}; link.onclick = event => event.stopPropagation(); link.append({{ _('Spule')|tojson }} + ' #' + record.spool_number + ' ', Object.assign(document.createElement('i'), {className: 'bi bi-box-arrow-up-right'})); details.append(link);
    }
  };
  const select = record => {
    selected = String(record.id); editor.hidden = false; title.textContent = '#'+record.id; state.textContent = '';
    value.value = record.tag_value || ''; comment.value = record.comment || '';
    value.disabled = Boolean(record.spool_number);
    value.title = record.spool_number ? {{ _('Der Tag-Wert kann bei einer zugeordneten Spule nicht geändert werden.')|tojson }} : '';
    (record.spool_number ? comment : value).focus();
    deleteButton.disabled = Boolean(record.spool_number);
    deleteButton.title = record.spool_number ? {{ _('Der NFC-Tag ist noch einer Spule zugeordnet.')|tojson }} : {{ _('NFC-Tag löschen')|tojson }};
    list.querySelectorAll('[data-nfc-id]').forEach(item => item.classList.toggle('is-selected', item.dataset.nfcId === selected));
  };
  list.addEventListener('click', event => { const item = event.target.closest('[data-nfc-id]'); if (item) select(records.get(item.dataset.nfcId)); });
  document.getElementById('nfc-search').addEventListener('input', event => { const query = event.target.value.toLowerCase(); list.querySelectorAll('[data-nfc-id]').forEach(item => { item.hidden = !item.textContent.toLowerCase().includes(query); }); });
  const save = async payload => {
    const response = await fetch('/inventory/manage/nfc-tags/' + selected, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
    const result = await response.json(); if (!response.ok) throw new Error(result.error || texts.error);
    records.set(selected, result.record); refreshItem(result.record); select(result.record); state.textContent = texts.saved;
  };
  [value, comment].forEach(input => input.addEventListener('change', async () => { if (!selected) return; try { await save({tag_value: value.value, comment: comment.value}); } catch (error) { showError(error.message); } }));
  document.getElementById('nfc-new').addEventListener('click', async () => {
    const tagValue = window.prompt({{ _('Tag-Wert')|tojson }} + ':'); if (!tagValue) return;
    try { const response = await fetch('/inventory/manage/nfc-tags', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tag_value:tagValue})}); const result=await response.json(); if(!response.ok) throw new Error(result.error || texts.error); window.location.reload(); } catch(error) { showError(error.message); }
  });
  document.getElementById('nfc-copy').addEventListener('click', async () => { if (!selected) return; try { const source=records.get(selected); const response=await fetch('/inventory/manage/nfc-tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag_value:source.tag_value+'-COPY',comment:source.comment || ''})}); const result=await response.json(); if(!response.ok) throw new Error(result.error || texts.error); window.location.reload(); } catch(error) { showError(error.message); } });
  document.getElementById('nfc-delete').addEventListener('click', async () => { if (!selected || !window.confirm(texts.confirm)) return; try { const response=await fetch('/inventory/manage/nfc-tags/'+selected,{method:'DELETE'}); const result=await response.json(); if(!response.ok) throw new Error(result.error || texts.deleteError); window.location.reload(); } catch(error) { showError(error.message); } });
  const requested = new URLSearchParams(window.location.search).get('edit'); if (requested && records.has(requested)) select(records.get(requested));
});
</script>
{% endblock %}
